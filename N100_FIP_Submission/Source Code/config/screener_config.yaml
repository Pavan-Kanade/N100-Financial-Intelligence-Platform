# Nifty 100 Financial Screener Configuration
# Definitions for 6 Preset Screeners and Metric Threshold Defaults

presets:
  Quality Compounder:
    description: "High ROE, conservative leverage, positive cash flows, and strong revenue growth"
    filters:
      return_on_equity_pct: { min: 15.0 }
      debt_to_equity: { max: 1.0 }
      free_cash_flow_cr: { min: 0.0 }
      revenue_cagr_5yr: { min: 10.0 }

  Value Pick:
    description: "Low valuation multiples (P/E, P/B), moderate debt, and healthy dividend yield"
    filters:
      pe_ratio: { max: 30.0 }
      pb_ratio: { max: 4.0 }
      debt_to_equity: { max: 2.0 }
      dividend_yield_pct: { min: 0.5 }

  Growth Accelerator:
    description: "High profit and revenue growth with controlled leverage"
    filters:
      pat_cagr_5yr: { min: 20.0 }
      revenue_cagr_5yr: { min: 15.0 }
      debt_to_equity: { max: 2.0 }

  Dividend Champion:
    description: "High dividend yield, reasonable payout ratio, and positive free cash flow"
    filters:
      dividend_yield_pct: { min: 2.0 }
      dividend_payout_ratio_pct: { max: 80.0 }
      free_cash_flow_cr: { min: 0.0 }

  Debt-Free Blue Chip:
    description: "Conservative leverage (D/E <= 0.1), strong ROE (>12%), and large revenue scale (> 2000 Cr)"
    filters:
      debt_to_equity: { max: 0.1 }
      return_on_equity_pct: { min: 12.0 }
      sales: { min: 2000.0 }

  Turnaround Watch:
    description: "3Y revenue growth > 10%, positive FCF, and improving debt metrics"
    filters:
      revenue_cagr_3yr: { min: 10.0 }
      free_cash_flow_cr: { min: 0.0 }

composite_weights:
  profitability: 0.35
  cash_quality: 0.30
  growth: 0.20
  leverage: 0.15
